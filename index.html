    const memeVideoIds = "CpR38VHczgPk-_BW"

    // --- Entrainment & Conditioning Parameters ---
    const frequencyHz = 6.9;                 // True 6.9 Hz Theta cycles per second
    const minFlickerMs = 7500;               // Jitter min (7.5s)
    const maxFlickerMs = 11000;              // Jitter max (11.0s)
    const forwardConditioningDelayMs = 150;  // 150ms lead time: Click -> 150ms -> Theta hits

    // --- Brightness / Mask Levels ---
    const baseBrightness = 0.98;
    const amplitude = 0.02;
    const fractionationPeak = 1.0;

    let animFrameId;

    const wrapper = document.getElementById('appWrapper');

            console.warn("YouTube embed restriction caught, switching video. Error code:", event.data);
            currentVideoIndex = (currentVideoIndex + 1) % memeVideoIds.length;
            if (ytPlayer && ytPlayer.loadVideoById) {
              ytPlayer.loadVideoById(memeVideoIds[currentVideoIndex]);

          }
        }

    async function unlockAudio() {
      if (audioUnlocked) return;
      try {
        audioEl.muted = true;
        await audioEl.play();
        audioEl.pause();
        audioEl.currentTime = 0;
        audioEl.muted = false;
        audioUnlocked = true;
      } catch (e) {}

      if (!audioUnlocked) return;
      try {
        audioEl.currentTime = 0;
        await audioEl.play();
      } catch (e) {}

    async function enterSeamlessFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) {
          await el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
          await el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
          await el.msRequestFullscreen();
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }

    function setLuminance(brightnessVal, transitionSec = 0) {
      const transCss = transitionSec > 0 ? `all ${transitionSec}s ease-in-out` : 'none';

      mask.style.transition = transCss;

      wrapper.style.filter = `brightness(${brightnessVal.toFixed(4)})`;
      const maskOpacity = Math.max(0, 1.0 - brightnessVal);
      mask.style.opacity = maskOpacity.toFixed(4);

      wrapper.style.transition = 'none';
      mask.style.transition = 'none';
      const startTime = performance.now();

      function tick(now) {
        const elapsedSec = (now - startTime) / 1000;
        const sineWave = Math.sin(2 * Math.PI * frequencyHz * elapsedSec);
        const currentBrightness = baseBrightness + (sineWave * amplitude);
        setLuminance(currentBrightness, 0);
        animFrameId = requestAnimationFrame(tick);

          setTimeout(() => {

      cancelAnimationFrame(animFrameId);

      startFlicker();
      const nextDuration = getRandomFlickerDuration();
      fractionationTimeout = setTimeout(runFractionationCycle, nextDuration);

      await enterSeamlessFullscreen();
      await unlockAudio();
      tap.classList.add('hidden');

      if (playerReady && ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
      }
      loopControl();
    });
  </script>
